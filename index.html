<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nkabom – Find trusted local experts</title>
<meta name="description" content="Find trusted local professionals and chat with them on WhatsApp." />
<meta name="theme-color" content="#B45309" />

<!-- Add to Home Screen: Android / Chrome -->
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="mobile-web-app-capable" content="yes" />
<!-- Add to Home Screen: iPhone / iPad (Safari) -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Nkabom" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<!-- Browser tab icon -->
<link rel="icon" type="image/png" href="/logo-icon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..600&family=IBM+Plex+Mono:wght@600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
<script>
(() => {
  try {
    const saved = localStorage.getItem('nkabom_theme') || localStorage.getItem('proconnect_theme');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = saved ? saved === 'dark' : prefersDark;
    if (isDark) {
      document.documentElement.classList.add('dark');
      const m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', '#100D0A');
    }
  } catch {}
})();
</script>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" class="hidden pop fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-ink text-white text-sm font-semibold px-5 py-3 rounded-xl shadow-xl max-w-[90vw] text-center"></div>
<script src="https://js.paystack.co/v2/inline.js" defer></script>
<script src="/loaders.js"></script>
<script src="/qr.js"></script>
<script src="/client.js"></script>
</body>
</html>
